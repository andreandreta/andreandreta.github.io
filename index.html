<title>André Andreta</title>
<meta name="description" content="André Andreta, power electronics, Université Grenoble Alpes, G2Elab.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #000000;
    --muted: #4d4d4d;
    --green: #1f4d3a;
    --green-soft: #6f9a83;
    --rule: #d6d6d6;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --ink: #ffffff;
      --muted: #b3b3b3;
      --green: #8cc3a5;
      --green-soft: #4c7a62;
      --rule: #333333;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.6;
  }
  main {
    max-width: 40rem;
    margin: 0 auto;
    padding: clamp(3rem, 10vw, 6rem) 1.5rem 3rem;
  }
  h1, h2 {
    font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
    font-weight: 600;
    line-height: 1.15;
  }
  h1 {
    font-size: clamp(2.5rem, 7vw, 3.75rem);
    letter-spacing: -0.015em;
    margin: 0;
  }
  .role {
    margin: 0.75rem 0 0;
    color: var(--muted);
    max-width: 34rem;
  }
  .waves {
    display: block;
    width: 100%;
    height: auto;
    margin: 2.75rem 0 3.5rem;
    overflow: visible;
  }
  .waves .axis { stroke: var(--rule); stroke-width: 1; }
  .waves .wave {
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: draw 1.8s cubic-bezier(.4,0,.2,1) forwards;
  }
  .waves .a { stroke: var(--green); }
  .waves .b { stroke: var(--ink); animation-delay: .25s; }
  .waves .c { stroke: var(--green-soft); animation-delay: .5s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .waves .wave { animation: none; stroke-dashoffset: 0; }
  }
  h2 {
    font-size: 1.5rem;
    margin: 0 0 1.25rem;
  }
  .item {
    border-top: 1px solid var(--rule);
    padding-top: 1.25rem;
  }
  .item h3 {
    font-size: 1.125rem;
    font-weight: 500;
    margin: 0;
  }
  .item .level {
    color: var(--muted);
    font-weight: 400;
  }
  .item p { margin: 0.4rem 0 0.9rem; }
  a {
    color: var(--green);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }
  a:hover { text-decoration-thickness: 2px; }
  a:focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 3px;
    border-radius: 2px;
  }
  footer {
    max-width: 40rem;
    margin: 0 auto;
    padding: 2rem 1.5rem 3rem;
    color: var(--muted);
    font-size: 0.875rem;
  }
</style>
</head>
